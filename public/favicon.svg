<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @font-face {
        font-family: 'Irish Grover';
        font-style: normal;
        font-weight: 400;
        /* Note: Webfonts are often blocked in favicons; this is a best-effort hint. */
        src: local('Irish Grover');
      }
      .txt {
        font-family: 'Irish Grover', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-size: 120px;
        font-weight: 400;
        fill: url(#g);
      }
    </style>
  </defs>
  <rect width="256" height="256" rx="48" ry="48" fill="#0b1220"/>
  <text class="txt" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">&lt;VS/&gt;</text>
</svg>


