services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"
    restart: unless-stopped

volumes:
  node_modules:
